# Publicación de TypingQuest en GitHub Pages (T18).
#
# Solo se ejecuta A MANO (pestaña Actions → «Publicar en GitHub Pages» → Run workflow).
# Siempre ejecuta las pruebas y construye el artefacto con tools/build-site.mjs (solo
# index.html, css, js, data y assets). Únicamente publica si se marca «publicar» y se
# lanza desde la rama predeterminada; antes hay que elegir «GitHub Actions» como origen
# en Settings → Pages (ver docs/publicacion.md).
#
# Acciones oficiales de GitHub fijadas por commit (la etiqueta va en el comentario).
name: Publicar en GitHub Pages

on:
  workflow_dispatch:
    inputs:
      publicar:
        description: 'Publicar la web (si no se marca, solo prueba y construye el artefacto)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Pruebas
        run: |
          node --test "tests/*.test.js"
          node --test ".claude/hooks/*.test.cjs"

      - name: Construir y comprobar el artefacto
        run: node tools/build-site.mjs _site

      - name: Contenido del artefacto
        run: find _site -type f | sort

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    if: inputs.publicar && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
